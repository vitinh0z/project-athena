# Clone, configure .env, rode com: docker compose up --build
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: chessanalyzer
      POSTGRES_USER: chess
      POSTGRES_PASSWORD: chess
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chess -d chessanalyzer"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chess-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/chessanalyzer
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      STOCKFISH_PATH: /usr/local/bin/stockfish
      LICHESS_API_TOKEN: ${LICHESS_API_TOKEN}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - chess-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - chess-net

volumes:
  postgres_data:

networks:
  chess-net:
    driver: bridge
