# Infraestrutura local de desenvolvimento — apenas postgres e redis.
# Suba com: docker compose up -d
# O backend e o frontend são executados fora do Docker (IDE ou terminal).
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${DB_NAME:-chessanalyzer}
      POSTGRES_USER: ${DB_USER:-chess}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-chess}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chess} -d ${DB_NAME:-chessanalyzer}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chess-net

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - chess-net

volumes:
  postgres_data:
  redis_data:

networks:
  chess-net:
    driver: bridge
