spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
  data:
    redis:
      url: ${REDIS_URL}
  jpa:
    hibernate:
      ddl-auto: validate

app:
  llm:
    api-key: ${LLM_API_KEY}
    provider: ${LLM_PROVIDER:openai}
  stockfish:
    path: ${STOCKFISH_PATH}
  lichess:
    api-token: ${LICHESS_API_TOKEN}
    base-url: https://lichess.org
